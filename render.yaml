services:
  - type: web
    name: pdfsamtale
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements-render.txt
    startCommand: python -m streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --server.fileWatcherType none --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: RETRIEVAL_MODE
        value: lexical
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
